[package]
name = "reticulum-sdk"
version = "2.3.1"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ReticulaLabs/reticulum-sdk"
categories = ["network-programming"]
keywords = ["reticulum", "mesh", "radio", "async"]

description = """
reticulum-sdk is a Rust implementation of the Reticulum Network Stack - a cryptographic,
decentralised, and resilient mesh networking protocol designed for communication over any physical 
layer.

This project brings Reticulum's capabilities to the Rust ecosystem, enabling embedded, and 
constrained deployments with maximum performance and minimal dependencies.
"""

[dependencies]

# Crypto
crypto-common = { version = "0.1.6", features = ["rand_core"] }
aes = "0.8.4"
cbc = "0.1.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hkdf = "0.12.4"
getrandom = { version = "0.4", features = ["sys_rng"] }

subtle = "2"

# Hash
hmac = "0.12.1"
sha2 = "0.10.8"

# Compression
# bzip2 >= 0.6 uses the pure-Rust libbz2-rs-sys backend by default; output
# is byte-identical to libbz2, which Python's bz2 module uses, so resources
# interoperate.
bzip2 = "0.6"

# Random Number generator
rand_core = "0.10"

# Portable 64-bit atomics. On 32-bit targets without hardware 64-bit CAS
# (e.g. the Xtensa ESP32-S3) `std::sync::atomic::AtomicU64` is unavailable;
# `portable-atomic` provides a compatible type with a spinlock fallback there.
portable-atomic = { version = "1", features = ["fallback"] }

# Async IO
# Targeted tokio feature set: `full` pulls in `signal`/`process`/`fs`, which
# add heavy dependencies (e.g. signal-hook-registry) that do not build on
# embedded targets such as ESP-IDF. Only the features the stack actually uses
# are enabled.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7.19"
# Serial interfaces (serial, KISS, RNode) are optional: they depend on
# `tokio-serial`/`serialport`, which are not available on every target.
tokio-serial = { version = "5.4.5", optional = true }
libc = "0.2.172"

rmp = "0.8.14"
rmpv = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Logging
log = "0.4.27"

# GPIO character device (Linux /dev/gpiochipN). Only used by the host-side
# LoRa GPIO abstraction, so it is optional and enabled via the `lora-linux`
# feature. Linux-only.
gpio-cdev = { version = "0.6", optional = true }

# embedded-hal traits for the LoRa interface's SPI + GPIO backend on embedded
# targets (SX126x / SX127x / LR1121 over an `embedded_hal::spi::SpiDevice`).
embedded-hal = { version = "1.0", optional = true }

[features]
# Resource-constrained targets (e.g. the ESP32, etc): shorter packet /
# destination / path retention so the transport state stays bounded on a busy
# network within a few hundred KB of RAM. Without this, the transport keeps
# the upstream (desktop) retention defaults.
embedded = []
# Serial / packet-radio interfaces that run over serial ports and depend on
# `tokio-serial`. Disabled for embedded builds that only need network
# interfaces (UDP/TCP/backbone).
serial = ["dep:tokio-serial"]
# LoRa interface. `embedded-hal` provides an SPI + GPIO backend usable on
# microcontrollers; the Linux spidev/gpio-cdev backends are added by
# `lora-linux`.
lora = ["dep:embedded-hal"]
# Linux backends for the LoRa interface (spidev ioctls + the gpio-cdev GPIO
# API). Linux-only; leave off for embedded builds.
lora-linux = ["lora", "dep:gpio-cdev"]
default = ["alloc", "serial", "lora", "lora-linux"]
alloc = []
fernet-aes128 = []



[dev-dependencies]
# Extra tokio features needed by examples/tests on the host only (signal for
# ctrl-c, io-std for stdin). These are never enabled for embedded builds.
tokio = { version = "1.44.2", features = ["test-util", "signal", "io-std", "io-util"] }
env_logger = "0.10"

[[example]]
name = "tcp_server"
path = "examples/tcp_server.rs"

[[example]]
name = "tcp_client"
path = "examples/tcp_client.rs"

[[example]]
name = "udp_link"
path = "examples/udp_link.rs"

[[example]]
name = "link_client"
path = "examples/link_client.rs"

[[example]]
name = "testnet_client"
path = "examples/testnet_client.rs"

[[example]]
name = "multihop"
path = "examples/multihop.rs"

[[example]]
name = "link_rx_bench"
path = "examples/link_rx_bench.rs"
